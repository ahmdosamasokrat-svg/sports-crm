services:
  app:
    image: sporttime-crm-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sporttime-crm-app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment: &sporttime_env
      APP_NAME: "SportTime CRM"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8081"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sokrat_crm_v2
      DB_USERNAME: sokrat_crm_v2_user
      DB_PASSWORD: sokrat_crm_v2_password_2026
      CRM_V2_ADMIN_USER: admin
      CRM_V2_ADMIN_PASSWORD: Admin@123
      CRM_V2_ADMIN_NAME: "مدير النظام"
      CRM_V2_ADMIN_EMAIL: "admin@localhost.invalid"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    volumes: &sporttime_volumes
      - ./:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/public/build

  queue:
    image: sporttime-crm-app:local
    container_name: sporttime-crm-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=0"]
    environment: *sporttime_env
    depends_on:
      db:
        condition: service_healthy
    volumes: *sporttime_volumes

  scheduler:
    image: sporttime-crm-app:local
    container_name: sporttime-crm-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment: *sporttime_env
    depends_on:
      db:
        condition: service_healthy
    volumes: *sporttime_volumes

  db:
    image: mysql:8.0
    container_name: sporttime-crm-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_v2_password_2026
      MYSQL_DATABASE: sokrat_crm_v2
      MYSQL_USER: sokrat_crm_v2_user
      MYSQL_PASSWORD: sokrat_crm_v2_password_2026
    ports:
      - "3309:3306"
    volumes:
      - sporttime_crm_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sokrat_crm_v2_user", "-psokrat_crm_v2_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  sporttime_crm_db_data:
